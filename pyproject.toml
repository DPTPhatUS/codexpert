[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "codexpert"
version = "0.1.0"
description = "AI-powered codebase QA and analysis library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"pydantic>=2.7.0",
	"langgraph>=0.2.0",
	"tree_sitter==0.20.4",
	"tree_sitter_languages==1.10.2",
	"chromadb>=0.5.0",
	"rank_bm25>=0.2.2",
	"networkx>=3.3",
	"sentence-transformers>=3.0.0",
	"python-dotenv>=1.0.1",
	"tqdm>=4.66.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.7.0"]
openai = ["openai>=1.30.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
